<div class="flex flex-col items-center justify-center min-h-full h-full bg-bg-main p-6 text-center select-none relative overflow-hidden">
  
  <!-- Subtle ambient glow background decoration -->
  <div class="absolute w-72 h-72 rounded-full bg-accent/5 blur-3xl pointer-events-none -top-12 -left-12"></div>
  <div class="absolute w-72 h-72 rounded-full bg-violet-500/5 blur-3xl pointer-events-none -bottom-12 -right-12"></div>

  <div class="relative z-10 flex flex-col items-center max-w-md w-full p-8 bg-surface-0/80 backdrop-blur-xl border border-border-light rounded-3xl shadow-xl shadow-black/5 dark:shadow-black/30 animate-fadeIn">
    
    <!-- Icon / Badge -->
    <div class="w-20 h-20 rounded-3xl bg-accent/10 border border-accent/20 flex items-center justify-center text-accent mb-6 shadow-inner relative group">
      <i class="ti ti-compass-off text-4xl group-hover:scale-110 transition-transform duration-300"></i>
    </div>

    <!-- Error Code & Title -->
    <span class="text-xs font-bold uppercase tracking-widest text-accent mb-1">Error 404</span>
    <h1 class="text-2xl font-bold text-text-primary font-display mb-2">Page Not Found</h1>

    <!-- Description -->
    <p class="text-xs text-text-muted leading-relaxed max-w-xs mb-8">
      The page you are looking for doesn't exist, was moved, or had its web address typed incorrectly.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center gap-3 w-full">
      <a 
        routerLink="/chats" 
        class="w-full py-3 px-5 bg-accent hover:bg-accent-hover text-white text-xs font-semibold rounded-2xl flex items-center justify-center gap-2 transition-all duration-200 shadow-md shadow-accent/15 cursor-pointer"
      >
        <i class="ti ti-message-circle text-base"></i>
        <span>Back to Chats</span>
      </a>

      <button 
        (click)="goBack()" 
        class="w-full py-3 px-5 bg-surface-1 hover:bg-surface-2 border border-border-light text-text-secondary hover:text-text-primary text-xs font-semibold rounded-2xl flex items-center justify-center gap-2 transition-all duration-200 cursor-pointer"
      >
        <i class="ti ti-arrow-left text-base"></i>
        <span>Previous Page</span>
      </button>
    </div>
  </div>

  <span class="absolute bottom-6 text-[11px] text-text-muted/60 font-mono">Loop Web App</span>
</div>
