<div class="fixed top-4 left-4 right-4 sm:top-6 sm:left-auto sm:right-6 z-[9999] flex flex-col gap-2.5 sm:max-w-sm w-auto sm:w-full pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    <div 
      class="pointer-events-auto w-full p-3.5 rounded-2xl shadow-xl border backdrop-blur-2xl flex items-center justify-between gap-3 transition-all duration-300 animate-fadeIn bg-surface-0/95 dark:bg-surface-1/95 shadow-black/10"
      [ngClass]="{
        'bg-emerald-500/10 border-emerald-500/40': toast.type === 'success',
        'bg-rose-500/10 border-rose-500/40': toast.type === 'error',
        'bg-amber-500/10 border-amber-500/40': toast.type === 'warning',
        'bg-accent/10 border-accent/40': toast.type === 'info'
      }"
    >
      <div class="flex items-center gap-2.5 min-w-0">
        @if (toast.type === 'success') {
          <i class="ti ti-circle-check text-xl flex-shrink-0 text-emerald-500"></i>
        } @else if (toast.type === 'error') {
          <i class="ti ti-alert-circle text-xl flex-shrink-0 text-rose-500"></i>
        } @else if (toast.type === 'warning') {
          <i class="ti ti-alert-triangle text-xl flex-shrink-0 text-amber-500"></i>
        } @else {
          <i class="ti ti-info-circle text-xl flex-shrink-0 text-accent"></i>
        }
        <span class="text-xs font-medium leading-snug break-words text-text-primary">{{ toast.message }}</span>
      </div>

      <button 
        (click)="dismiss(toast.id)" 
        class="w-6 h-6 rounded-full flex items-center justify-center hover:bg-surface-2/80 cursor-pointer transition-colors flex-shrink-0 text-text-muted hover:text-text-primary"
        aria-label="Dismiss toast"
      >
        <i class="ti ti-x text-xs"></i>
      </button>
    </div>
  }
</div>
